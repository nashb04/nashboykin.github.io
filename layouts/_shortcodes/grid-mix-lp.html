<div class="glp" id="glp">

    <div class="glp-presets">
        <button class="glp-preset" data-price="91" type="button">LLNL realistic ($91/MWh)</button>
        <button class="glp-preset is-active" data-price="55" type="button">Midpoint ($55/MWh)</button>
        <button class="glp-preset" data-price="25" type="button">Hawker optimistic ($25/MWh)</button>
    </div>

    <div class="glp-slider-row">
        <div class="glp-slider-head">
            <label for="glp-price">Fusion LCOE</label>
            <span class="glp-slider-val" id="glp-price-val"></span>
        </div>
        <input type="range" id="glp-price" min="20" max="200" step="1" value="55">
    </div>

    <div class="glp-result">
        <div class="glp-cost">
            <span class="glp-cost-label">Total system cost, meeting all 135.6 TWh of NC's 2024 demand</span>
            <span class="glp-cost-val" id="glp-cost">—</span>
        </div>
        <div class="glp-mix" id="glp-mix"></div>
        <p class="glp-regime" id="glp-regime"></p>
    </div>

    <p class="glp-hint">This is what the model says to build, not a forecast &mdash; it holds solar, wind, and fission's own prices fixed and only varies fusion's.</p>
</div>

<script>
(function () {
    var D = 135.6;           // TWh, NC 2024 electricity demand (EIA)
    var VRE_CAP = 0.30 * D;  // NREL ERGIS: Eastern Interconnection can feasibly take ~30% wind + solar combined
    var P_SOLAR = 58;        // $/MWh, Lazard LCOE+ utility-scale solar midpoint
    var P_WIND = 62;         // $/MWh, Lazard LCOE+ onshore wind midpoint
    var P_FISSION = 181;     // $/MWh, Lazard LCOE+ new nuclear (fission) midpoint

    var root = document.getElementById("glp");
    if (!root) return;
    var slider = document.getElementById("glp-price");
    var priceVal = document.getElementById("glp-price-val");
    var costEl = document.getElementById("glp-cost");
    var mixEl = document.getElementById("glp-mix");
    var regimeEl = document.getElementById("glp-regime");

    function fmtTWh(v) { return v.toFixed(1) + " TWh"; }
    function fmtCost(v) {
        return "$" + (v / 1000).toFixed(2) + "B/yr";
    }

    // Solar and wind share one combined 30% cap (they're both "variable renewables"
    // to the grid). Solar is cheaper than wind at every point in this model, so it
    // always fills that capped bucket first -- wind's optimal quantity is zero here,
    // same as fission, just for a different reason (dominated by a cheaper peer
    // instead of a pricier one).
    function solve(pf) {
        var Sol, W, N, F, regime;
        if (pf < P_SOLAR) {
            Sol = 0; W = 0; N = 0; F = D;
            regime = "Fusion undercuts even solar (< $" + P_SOLAR + "/MWh): the model abandons every other source entirely.";
        } else if (pf < P_FISSION) {
            Sol = VRE_CAP; W = 0; N = 0; F = D - VRE_CAP;
            regime = "Fusion beats fission but not solar: solar fills its 30% ceiling, fusion fills the rest. Wind and fission both stay at zero.";
        } else {
            Sol = VRE_CAP; W = 0; N = D - VRE_CAP; F = 0;
            regime = "Fusion is priced worse than fission ($" + P_FISSION + "/MWh): the model fills the non-solar share with fission instead.";
        }
        var cost = P_SOLAR * Sol + P_WIND * W + P_FISSION * N + pf * F;
        return { Sol: Sol, W: W, N: N, F: F, cost: cost, regime: regime };
    }

    function render() {
        var pf = Number(slider.value);
        priceVal.textContent = "$" + pf + "/MWh";
        var r = solve(pf);
        costEl.textContent = fmtCost(r.cost);
        regimeEl.textContent = r.regime;

        var rows = [
            { label: "Solar", value: r.Sol, color: "#d97706" },
            { label: "Wind", value: r.W, color: "var(--secondary)" },
            { label: "Fission", value: r.N, color: "var(--tertiary)" },
            { label: "Fusion", value: r.F, color: "var(--primary)" }
        ];
        var max = D;
        mixEl.innerHTML = "";
        rows.forEach(function (row) {
            var el = document.createElement("div");
            el.className = "glp-mix-row";
            var pct = Math.min(100, (row.value / max) * 100);
            el.innerHTML =
                '<span class="glp-mix-label">' + row.label + '</span>' +
                '<div class="glp-mix-track"><div class="glp-mix-fill" style="width:' + pct + '%; background:' + row.color + '"></div></div>' +
                '<span class="glp-mix-num">' + fmtTWh(row.value) + '</span>';
            mixEl.appendChild(el);
        });
    }

    slider.addEventListener("input", function () {
        root.querySelectorAll(".glp-preset").forEach(function (b) { b.classList.remove("is-active"); });
        render();
    });

    root.querySelectorAll(".glp-preset").forEach(function (btn) {
        btn.addEventListener("click", function () {
            slider.value = btn.dataset.price;
            root.querySelectorAll(".glp-preset").forEach(function (b) { b.classList.remove("is-active"); });
            btn.classList.add("is-active");
            render();
        });
    });

    render();
})();
</script>
